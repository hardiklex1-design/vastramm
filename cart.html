<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — VASTRAMM</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f2;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:30px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #292929;padding-bottom:20px;letter-spacing:3px;font-weight:900}.panel{border:1px solid #292929;background:#111;padding:22px;margin-top:30px}.item{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid #292929}.item img{width:90px;height:90px;object-fit:cover;background:#171717}.muted{color:#888}.qty{width:70px;background:#0b0b0b;color:#fff;border:1px solid #444;padding:9px}.btn{display:inline-block;background:#fff;color:#000;padding:14px 20px;border:0;font-weight:800;text-decoration:none;margin-top:20px}.danger{background:#222;color:#fff;border:1px solid #444}.total{font-size:25px;text-align:right;margin-top:20px}@media(max-width:650px){.wrap{padding:18px}.item{grid-template-columns:65px 1fr}.item img{width:65px;height:65px}.item .right{grid-column:2}}
</style></head><body><div class="wrap"><nav class="nav"><a href="index.html">VASTRAMM</a><a href="index.html#collection">SHOP</a></nav><main id="app"></main></div><script>
function cart(){try{return JSON.parse(localStorage.getItem('vastramm_cart')||'[]')}catch(e){return[]}}function save(c){localStorage.setItem('vastramm_cart',JSON.stringify(c));render()}function render(){const c=cart();const app=document.getElementById('app');if(!c.length){app.innerHTML='<div class="panel"><h1>YOUR CART IS EMPTY.</h1><p class="muted">Add a piece from the collection to continue.</p><a class="btn" href="index.html#collection">SHOP COLLECTION</a></div>';return}let total=0;app.innerHTML='<div class="panel"><h1>YOUR CART</h1>'+c.map((x,i)=>{total+=x.price*x.qty;return '<div class="item"><img src="'+(x.image||'')+'"><div><b>'+x.name+'</b><div class="muted">₹'+x.price.toLocaleString('en-IN')+'</div></div><div class="right"><input class="qty" type="number" min="1" value="'+x.qty+'" onchange="change('+i+',this.value)"> <button class="btn danger" style="margin-top:0;padding:9px 12px" onclick="removeItem('+i+')">REMOVE</button></div></div>'}).join('')+'<div class="total">TOTAL — ₹'+total.toLocaleString('en-IN')+'</div><div style="text-align:right"><a class="btn" href="checkout.html">CHECKOUT</a></div></div>'}function change(i,v){const c=cart();c[i].qty=Math.max(1,Number(v)||1);save(c)}function removeItem(i){const c=cart();c.splice(i,1);save(c)}render();
</script></body></html>
