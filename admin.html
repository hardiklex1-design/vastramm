<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VASTRAMM — Admin Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#f5f5f5;font:14px Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center}.card{background:#151515;border:1px solid #333;padding:30px;border-radius:14px;width:min(420px,92vw)}
input,textarea,select{width:100%;background:#0d0d0d;color:#fff;border:1px solid #3a3a3a;border-radius:8px;padding:11px;margin:7px 0 14px}
.btn{background:#fff;color:#000;border:0;border-radius:8px;padding:11px 16px;font-weight:700}.btn.secondary{background:#222;color:#fff;border:1px solid #444}
#app{display:flex;min-height:100vh}.side{width:230px;border-right:1px solid #252525;padding:22px;position:fixed;height:100vh}.brand{font-weight:900;letter-spacing:2px;margin-bottom:25px}.nav button{display:block;width:100%;text-align:left;background:none;color:#aaa;border:0;padding:12px;border-radius:7px;margin:3px 0}.nav button.active,.nav button:hover{background:#1c1c1c;color:#fff}.main{margin-left:230px;padding:30px;width:calc(100% - 230px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{background:#151515;border:1px solid #292929;padding:18px;border-radius:12px}.stat b{font-size:25px;display:block;margin-top:8px}.panel{background:#111;border:1px solid #292929;border-radius:12px;padding:18px;margin-top:18px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #252525;padding:12px 0}.row:last-child{border-bottom:0}.muted{color:#888}.danger{color:#ff7777}.thumb{width:58px;height:58px;object-fit:cover;border-radius:7px;border:1px solid #333}.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#000;padding:12px 16px;border-radius:8px}
@media(max-width:700px){.side{width:70px;padding:12px}.brand{font-size:0}.brand:after{content:"V";font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:20px}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h1>VASTRAMM</h1><p class="muted">Digital Atelier — Admin</p>
    <label>Email</label><input id="email" type="email" placeholder="Admin email">
    <label>Password</label><input id="password" type="password" placeholder="Password">
    <button class="btn" id="loginBtn">Sign in</button>
    <p id="loginMsg" class="muted"></p><p id="loginHelp" class="muted" style="font-size:12px;line-height:1.5"></p>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="side"><div class="brand">VASTRAMM</div><div class="nav">
    <button data-page="dashboard" class="active">Dashboard</button>
    <button data-page="products">Products</button>
    <button data-page="numbers">Numbers</button>
    <button data-page="collections">Collections</button>
    <button data-page="pages">Pages</button>
    <button data-page="media">Media</button>
    <button data-page="orders">Orders</button><button data-page="homepage">Homepage</button><button data-page="navigation">Navigation</button><button data-page="settings">Settings</button>
  </div></aside>
  <main class="main">
    <div class="top"><div><h2 id="title">Dashboard</h2><span class="muted">Connected to Supabase</span></div><button class="btn secondary" id="logout">Sign out</button></div>
    <section id="content"></section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://xzipzscjjvkjuzkmtxsj.supabase.co";
const SUPABASE_KEY="sb_publishable_GlX_WAPD7MApMRMGGVvMxA_2NtPC_y9";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const content=document.getElementById('content');
const toast=(m)=>{let t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)};
async function adminOK(){
 const {data:{user},error}=await db.auth.getUser();
 if(error||!user)return false;
 return String(user.email||'').toLowerCase()==='hardiklex1@gmail.com';
}
async function directPasswordLogin(email,password){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),10000);
 try{
   const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
     method:'POST',
     headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
     body:JSON.stringify({email,password}),
     signal:controller.signal
   });
   const raw=await res.text();
   let body={}; try{body=JSON.parse(raw)}catch{}
   if(!res.ok) throw new Error((body.error_description||body.msg||body.message||('Authentication failed (HTTP '+res.status+')')));
   if(!body.access_token||!body.refresh_token) throw new Error('Authentication succeeded but Supabase did not return a session.');
   // Supabase can occasionally hang while persisting the session during an API incident.
   // Persist the returned session ourselves so the admin UI can continue without waiting.
   const projectRef=SUPABASE_URL.replace('https://','').split('.')[0];
   const storageKey='sb-'+projectRef+'-auth-token';
   const expiresAt=body.expires_at || Math.floor(Date.now()/1000)+(body.expires_in||3600);
   localStorage.setItem(storageKey,JSON.stringify({access_token:body.access_token,refresh_token:body.refresh_token,token_type:body.token_type||'bearer',expires_in:body.expires_in||3600,expires_at:expiresAt,user:body.user}));
   return body;
 }catch(e){
   if(e.name==='AbortError') throw new Error('Supabase authentication timed out after 10 seconds.');
   throw e;
 }finally{clearTimeout(timer)}
}
async function boot(){
 try{
   const {data:{session}}=await db.auth.getSession();
   if(session && String(session.user?.email||'').toLowerCase()==='hardiklex1@gmail.com') showApp(); else showLogin();
 }catch(e){showLogin()}
}
function showLogin(){const l=document.getElementById('login'),a=document.getElementById('app');l.classList.remove('hidden');l.style.display='grid';a.classList.add('hidden');a.style.display='none'}
function showApp(){const l=document.getElementById('login'),a=document.getElementById('app');l.classList.add('hidden');l.style.display='none';a.classList.remove('hidden');a.style.display='flex';document.getElementById('title').textContent='Dashboard';dashboard().catch(e=>{content.innerHTML='<div class="panel"><h3>VASTRAMM Admin</h3><p class="muted">Signed in. Dashboard data is temporarily unavailable.</p></div>'})}
document.getElementById('loginBtn').onclick=async()=>{
 const msg=document.getElementById('loginMsg'); const help=document.getElementById('loginHelp');
 const email=document.getElementById('email').value.trim(); const password=document.getElementById('password').value;
 msg.textContent='Signing in…'; help.textContent='Using direct Supabase authentication…';
 try{
   const body=await directPasswordLogin(email,password);
   if(String(body.user?.email||email).toLowerCase()!=='hardiklex1@gmail.com'){
     await db.auth.signOut(); msg.textContent='This account is not a VASTRAMM admin.'; return;
   }
   msg.textContent='Signed in.'; help.textContent='Loading your admin panel…'; showApp();
 }catch(e){
   msg.textContent=e.message||'Unable to sign in.';
   help.textContent='This message is the exact authentication error; no more browser setting changes are needed.';
 }
};
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();showLogin()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.page)});

async function count(t){const {count,error}=await db.from(t).select('*',{count:'exact',head:true});return error?0:count||0}
async function load(p){
 document.getElementById('title').textContent=p[0].toUpperCase()+p.slice(1);
 if(p==='dashboard')return dashboard();
 if(p==='products')return products();
 if(p==='numbers')return numbers();
 if(p==='media')return media();
 if(p==='homepage')return homepage();
 if(p==='navigation')return navigation();
 if(p==='settings')return settings();
 return simple(p);
}
async function dashboard(){
 content.innerHTML='<div class="grid"><div class="stat">Products<b id="s-products">—</b></div><div class="stat">Numbers<b id="s-numbers">—</b></div><div class="stat">Orders<b id="s-orders">—</b></div><div class="stat">Pages<b id="s-pages">—</b></div><div class="stat">Media<b id="s-media">—</b></div></div><div class="panel"><h3>VASTRAMM Admin</h3><p class="muted">Signed in successfully. Loading store data…</p></div>';
 const names=['products','numbers','orders','pages','media'];
 const results=await Promise.all(names.map(async t=>Promise.race([count(t),new Promise(r=>setTimeout(()=>r(null),5000))])));
 results.forEach((v,k)=>{const e=document.getElementById('s-'+names[k]);if(e)e.textContent=v===null?'—':v});
 const note=document.querySelector('.panel p');
 if(note)note.textContent=results.some(v=>v===null)?'Admin is open. Some Supabase data is temporarily unavailable.':'Your admin panel is connected to Supabase.';
}
async function products(){
 const {data,error}=await db.from('products').select('*').order('sort_order');
 if(error)return content.innerHTML=`<div class="panel">${error.message}</div>`;
 content.innerHTML=`<div class="panel"><div class="top"><h3>Products</h3><button class="btn" onclick="newProduct()">+ Add product</button></div>${data.map(x=>`<div class="row"><div><b>${x.name}</b><div class="muted">${x.sku} · ₹${Number(x.price).toLocaleString('en-IN')} · ${x.stock} stock</div></div><button class="btn secondary" onclick="editProduct('${x.id}')">Edit</button></div>`).join('')}</div>`;
}
window.newProduct=()=>productForm();
window.editProduct=async id=>{let {data}=await db.from('products').select('*').eq('id',id).single();productForm(data)};
function productForm(x={}){const imgs=Array.isArray(x.image_urls)?x.image_urls:[];content.innerHTML='<div class="panel"><h3>'+(x.id?'Edit':'Add')+' product</h3><label>SKU</label><input id="fsku" value="'+(x.sku||'')+'"><label>Name</label><input id="fname" value="'+(x.name||'')+'"><label>Slug</label><input id="fslug" value="'+(x.slug||'')+'"><label>Price</label><input id="fprice" type="number" value="'+(x.price||0)+'"><label>Stock</label><input id="fstock" type="number" value="'+(x.stock||0)+'"><label>Status</label><select id="fstatus"><option value="available" '+(x.status==='available'?'selected':'')+'>Available</option><option value="soldout" '+(x.status==='soldout'?'selected':'')+'>Sold out</option></select><label>Description</label><textarea id="fdesc" rows="5">'+(x.description||'')+'</textarea><label>Product images</label><input id="fimages" type="file" multiple accept="image/*"><label>Existing image URLs (one per line)</label><textarea id="furls" rows="4">'+imgs.join('\n')+'</textarea><label><input id="ffeatured" type="checkbox" style="width:auto" '+(x.featured?'checked':'')+'> Featured</label><br><br><button class="btn" onclick="saveProduct(\''+(x.id||'')+'\')">Save product</button> <button class="btn secondary" onclick="products()">Cancel</button>'+(x.id?' <button class="btn secondary" onclick="deleteProduct(\''+x.id+'\')">Delete</button>':'')+'</div>';}
window.saveProduct=async function(id){try{let urls=document.getElementById('furls').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);const files=Array.from(document.getElementById('fimages').files||[]);for(const file of files){const path='products/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'-');const up=await db.storage.from('vastramm-media').upload(path,file,{upsert:false});if(up.error)throw up.error;urls.push(db.storage.from('vastramm-media').getPublicUrl(path).data.publicUrl)}const row={sku:document.getElementById('fsku').value.trim(),name:document.getElementById('fname').value.trim(),slug:document.getElementById('fslug').value.trim(),price:Number(document.getElementById('fprice').value||0),stock:Number(document.getElementById('fstock').value||0),description:document.getElementById('fdesc').value,image_urls:urls,status:document.getElementById('fstatus').value,featured:document.getElementById('ffeatured').checked};const r=id?await db.from('products').update(row).eq('id',id):await db.from('products').insert(row);if(r.error)throw r.error;toast('Product saved');products()}catch(e){toast(e.message||'Could not save product')}};
async function numbers(){
 const {data,error}=await db.from('numbers').select('*').order('sort_order');
 if(error)return content.innerHTML=`<div class="panel">${error.message}</div>`;
 content.innerHTML=`<div class="panel"><h3>THE NUMBERS</h3>${data.map(x=>`<div class="row"><div><b>${x.label}</b><div class="muted">${x.value}</div></div><button class="btn secondary" onclick="editNumber('${x.id}')">Edit</button></div>`).join('')}</div>`;
}
window.editNumber=async id=>{let {data}=await db.from('numbers').select('*').eq('id',id).single();content.innerHTML=`<div class="panel"><h3>Edit statistic</h3><label>Label</label><input id="nl" value="${data.label}"><label>Value</label><input id="nv" value="${data.value}"><label>Description</label><input id="nd" value="${data.description||''}"><button class="btn" onclick="saveNumber('${id}')">Save</button> <button class="btn secondary" onclick="numbers()">Cancel</button></div>`};
window.saveNumber=async id=>{let r=await db.from('numbers').update({label:nl.value,value:nv.value,description:nd.value}).eq('id',id);if(r.error)toast(r.error.message);else{toast('Saved');numbers()}};
async function media(){
 const {data,error}=await db.storage.from('vastramm-media').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});
 if(error)return content.innerHTML=`<div class="panel">${error.message}</div>`;
 content.innerHTML=`<div class="panel"><h3>Media Library</h3><input id="file" type="file" multiple accept="image/*"><button class="btn" onclick="uploadMedia()">Upload images</button><div class="grid" style="margin-top:18px">${data.map(x=>{let u=db.storage.from('vastramm-media').getPublicUrl(x.name).data.publicUrl;return `<div class="stat"><img class="thumb" src="${u}"><div style="word-break:break-all;margin-top:8px">${x.name}</div></div>`}).join('')}</div></div>`;
}
window.uploadMedia=async()=>{let files=[...file.files];if(!files.length)return toast('Choose images first');for(const f of files){let path=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'-');let r=await db.storage.from('vastramm-media').upload(path,f,{upsert:false});if(r.error)return toast(r.error.message);let u=db.storage.from('vastramm-media').getPublicUrl(path).data.publicUrl;await db.from('media').insert({file_name:f.name,file_url:u,file_type:f.type,file_size:f.size})}toast('Images uploaded');media()};
async function simple(p){let table=p==='collections'?'collections':p;let {data,error}=await db.from(table).select('*').limit(100);content.innerHTML=`<div class="panel"><h3>${p[0].toUpperCase()+p.slice(1)}</h3>${error?error.message:(data.length?data.map(x=>`<div class="row"><b>${x.name||x.title||x.order_number||x.label||x.setting_key||x.slug||x.id}</b><span class="muted">${x.created_at?new Date(x.created_at).toLocaleDateString():''}</span></div>`).join(''):'No records yet.')}</div>`}

async function homepage(){
 const r=await db.from('site_settings').select('*').eq('key','homepage').maybeSingle();
 const v=r.data&&r.data.value?r.data.value:{};
 content.innerHTML='<div class="panel"><h3>Homepage Editor</h3><label>Hero heading</label><textarea id="hh" rows="3">'+(v.hero_heading||'WEAR\\nTHE\\nVOID.')+'</textarea><label>Hero description</label><textarea id="hd" rows="3">'+(v.hero_description||'')+'</textarea><label>CTA label</label><input id="hc" value="'+(v.cta_label||'Explore collection')+'"><label>CTA URL</label><input id="hu" value="'+(v.cta_url||'#collection')+'"><label>Hero image URL</label><input id="hi" value="'+(v.hero_image||'')+'"><label>Atelier title</label><textarea id="st" rows="2">'+(v.story_title||'MADE IN INDIA.\\nBUILT DIFFERENT.')+'</textarea><label>Atelier description</label><textarea id="sd" rows="4">'+(v.story_description||'')+'</textarea><button class="btn" onclick="saveHomepage()">Save homepage</button></div>';
}
window.saveHomepage=async function(){
 const value={hero_heading:document.getElementById('hh').value,hero_description:document.getElementById('hd').value,cta_label:document.getElementById('hc').value,cta_url:document.getElementById('hu').value,hero_image:document.getElementById('hi').value,story_title:document.getElementById('st').value,story_description:document.getElementById('sd').value};
 const r=await db.from('site_settings').upsert({key:'homepage',value:value},{onConflict:'key'});
 if(r.error)toast(r.error.message);else toast('Homepage saved');
};
async function navigation(){
 const r=await db.from('navigation').select('*').order('sort_order');
 if(r.error)return content.innerHTML='<div class="panel">'+r.error.message+'</div>';
 content.innerHTML='<div class="panel"><div class="top"><h3>Navigation</h3><button class="btn" onclick="editNav()">+ Add link</button></div>'+(r.data||[]).map(function(x){return '<div class="row"><div><b>'+x.label+'</b><div class="muted">'+x.url+'</div></div><div><button class="btn secondary" onclick="editNav(\''+x.id+'\')">Edit</button> <button class="btn secondary" onclick="deleteNav(\''+x.id+'\')">Delete</button></div></div>'}).join('')+'</div>';
}
window.editNav=async function(id){
 const x=id?(await db.from('navigation').select('*').eq('id',id).single()).data:{};
 content.innerHTML='<div class="panel"><h3>Navigation link</h3><label>Label</label><input id="nlabel" value="'+(x.label||'')+'"><label>URL</label><input id="nurl" value="'+(x.url||'')+'"><label>Order</label><input id="norder" type="number" value="'+(x.sort_order||0)+'"><label><input id="nvis" type="checkbox" style="width:auto" '+(x.visible!==false?'checked':'')+'> Visible</label><br><br><button class="btn" onclick="saveNav(\''+(id||'')+'\')">Save</button> <button class="btn secondary" onclick="navigation()">Cancel</button></div>';
};
window.saveNav=async function(id){
 const row={label:document.getElementById('nlabel').value,url:document.getElementById('nurl').value,sort_order:Number(document.getElementById('norder').value||0),visible:document.getElementById('nvis').checked};
 const r=id?await db.from('navigation').update(row).eq('id',id):await db.from('navigation').insert(row);
 if(r.error)toast(r.error.message);else{toast('Navigation saved');navigation()}
};
window.deleteNav=async function(id){if(!confirm('Delete this link?'))return;const r=await db.from('navigation').delete().eq('id',id);if(r.error)toast(r.error.message);else navigation()};
async function settings(){
 const r=await db.from('site_settings').select('*').order('key');
 content.innerHTML='<div class="panel"><h3>Store Settings</h3><label>Key</label><input id="sk"><label>Value</label><textarea id="sv" rows="5"></textarea><button class="btn" onclick="saveSetting()">Save</button></div><div class="panel"><h3>Existing settings</h3>'+(r.data||[]).map(function(x){return '<div class="row"><div><b>'+x.key+'</b><div class="muted">'+JSON.stringify(x.value)+'</div></div><button class="btn secondary" onclick="loadSetting(\''+x.key.replace(/'/g,"\\'")+'\')">Edit</button></div>'}).join('')+'</div>';
}
window.loadSetting=async function(key){const r=await db.from('site_settings').select('*').eq('key',key).single();if(r.data){document.getElementById('sk').value=r.data.key;document.getElementById('sv').value=typeof r.data.value==='string'?r.data.value:JSON.stringify(r.data.value,null,2)}};
window.saveSetting=async function(){let v=document.getElementById('sv').value;try{v=JSON.parse(v)}catch(e){}const r=await db.from('site_settings').upsert({key:document.getElementById('sk').value.trim(),value:v},{onConflict:'key'});if(r.error)toast(r.error.message);else{toast('Setting saved');settings()}};
window.deleteProduct=async function(id){if(!confirm('Delete this product?'))return;const r=await db.from('products').delete().eq('id',id);if(r.error)toast(r.error.message);else{toast('Product deleted');products()}};

boot();
</script>
</body>
</html>
