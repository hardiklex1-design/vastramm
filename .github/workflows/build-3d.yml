name: Build VASTRAMM 3D garment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'Generate VASTRAMM 3D model') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GLB
        run: |
          python -m pip install --quiet pillow trimesh shapely numpy
          python .github/build_vastramm_3d.py
      - name: Commit GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vastramm-tee-3d.glb
          git diff --cached --quiet && exit 0
          git commit -m "Generate VASTRAMM 3D model"
          git push
