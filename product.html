<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — VASTRAMM BY MY3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f2;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:0 28px}a{color:inherit;text-decoration:none}.nav{padding:25px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between;letter-spacing:3px;font-weight:900}.back{display:inline-block;border:1px solid #555;padding:12px 18px;font-size:11px;letter-spacing:2px}.product{display:grid;grid-template-columns:1.2fr .8fr;gap:60px;padding:70px 0}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111;border:1px solid #292929}.info{padding-top:20px}.ey{font-size:11px;letter-spacing:4px;color:#888}.info h1{font-size:clamp(45px,7vw,90px);line-height:.88;letter-spacing:-5px;margin:25px 0}.price{font-size:25px;margin:20px 0}.desc{color:#aaa;line-height:1.8;white-space:pre-line}.pill{display:inline-block;border:1px solid #444;padding:8px 11px;font-size:10px;letter-spacing:2px;margin:10px 0 25px}.empty{background:#111;border:1px solid #292929;aspect-ratio:1/1;display:grid;place-items:center;color:#777}@media(max-width:800px){.product{grid-template-columns:1fr;gap:25px;padding:35px 0}.gallery{grid-template-columns:1fr}.info h1{font-size:55px}}
 .buybox{margin-top:30px;border-top:1px solid #292929;padding-top:25px}.buybox label{display:block;font-size:11px;letter-spacing:2px;color:#888;margin-bottom:8px}.buybox input{width:90px;background:#111;color:#fff;border:1px solid #444;padding:12px}.actions{display:flex;gap:10px;margin:14px 0}.buy{background:#fff;color:#000;border:0;padding:15px 22px;font-weight:800;letter-spacing:1px;cursor:pointer}.buy.alt{background:#222;color:#fff;border:1px solid #555}.track{display:inline-block;font-size:10px;letter-spacing:2px;color:#aaa;margin-top:8px}</head><body><div class="wrap"><nav class="nav"><a href="index.html">VASTRAMM</a><a href="index.html#collection">BACK TO COLLECTION ↗</a></nav><main id="page"><div class="product"><div class="empty">LOADING</div><div class="info"><div class="ey">VASTRAMM BY MY3</div><h1>LOADING</h1></div></div></main></div><script>
const db=window.supabase.createClient("https://xzipzscjjvkjuzkmtxsj.supabase.co","sb_publishable_GlX_WAPD7MApMRMGGVvMxA_2NtPC_y9");
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
(async()=>{try{const id=new URLSearchParams(location.search).get("id");if(!id)throw new Error("Product not found.");const r=await db.from("products").select("*").eq("id",id).single();if(r.error)throw r.error;const m=(await db.from("site_settings").select("setting_value").eq("setting_key","product_meta_"+id).maybeSingle()).data?.setting_value||{};const imgs=Array.isArray(m.images)?m.images:[];document.title=(r.data.name||"Product")+" — VASTRAMM";document.getElementById("page").innerHTML='<div class="product"><div class="gallery">'+(imgs.length?imgs.map(u=>'<img src="'+esc(u)+'" alt="'+esc(r.data.name)+'">').join(""):'<div class="empty">NO IMAGE</div>')+'</div><div class="info"><div class="ey">'+esc(r.data.sku||"VASTRAMM")+' / PRODUCT</div><h1>'+esc(r.data.name)+'</h1><div class="price">₹'+Number(r.data.price||0).toLocaleString("en-IN")+'</div><span class="pill">'+esc(m.status==="soldout"?"SOLD OUT":m.featured?"FEATURED":"AVAILABLE")+'</span><p class="desc">'+esc(r.data.description||"No description available.")+'</p><div class="buybox"><label>Quantity</label><input id="qty" type="number" min="1" value="1"><div class="actions"><button class="buy" id="add">ADD TO CART</button><button class="buy alt" id="buy">BUY NOW</button></div><a class="track" href="cart.html">VIEW CART</a></div><br><a class="back" href="index.html#collection">← Back to collection</a></div></div>'}catch(e){document.getElementById("page").innerHTML='<div class="product"><div class="info"><div class="ey">VASTRAMM BY MY3</div><h1>PRODUCT NOT FOUND.</h1><p class="desc">'+esc(e.message||"Unable to load this product.")+'</p><a class="back" href="index.html#collection">← Back to collection</a></div></div>'}})();

</script>
<script>
function cart(){try{return JSON.parse(localStorage.getItem('vastramm_cart')||'[]')}catch(e){return[]}}
function saveCart(x){localStorage.setItem('vastramm_cart',JSON.stringify(x))}
function addToCart(go){const qty=Math.max(1,Number(document.getElementById('qty').value||1));const item={id:r.data.id,name:r.data.name,sku:r.data.sku||'',price:Number(r.data.price||0),qty:qty,image:imgs[0]||''};const cart0=cart();const found=cart0.find(x=>String(x.id)===String(item.id));if(found)found.qty+=qty;else cart0.push(item);saveCart(cart0);if(go)location.href='checkout.html';else{const b=document.getElementById('add');b.textContent='ADDED ✓';setTimeout(()=>b.textContent='ADD TO CART',1500)}}
document.getElementById('add').onclick=()=>addToCart(false);document.getElementById('buy').onclick=()=>addToCart(true);
</script></body></html>
