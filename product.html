<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — VASTRAMM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f2;font-family:Arial,sans-serif;position:relative;overflow-x:hidden}.brand-watermark{position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(90px,18vw,280px);font-weight:900;letter-spacing:-12px;color:rgba(255,255,255,.025);pointer-events:none;z-index:0;transform:rotate(-8deg)}.wrap{position:relative;z-index:1;max-width:1200px;margin:auto;padding:0 28px}a{color:inherit;text-decoration:none}.nav{padding:25px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between;letter-spacing:3px;font-weight:900}.back{display:inline-block;border:1px solid #555;padding:12px 18px;font-size:11px;letter-spacing:2px}.product{display:grid;grid-template-columns:1.2fr .8fr;gap:60px;padding:70px 0}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111;border:1px solid #292929}.info{padding-top:20px}.ey{font-size:11px;letter-spacing:4px;color:#888}.info h1{font-size:clamp(45px,7vw,90px);line-height:.88;letter-spacing:-5px;margin:25px 0}.price{font-size:25px;margin:20px 0}.desc{color:#aaa;line-height:1.8;white-space:pre-line}.pill{display:inline-block;border:1px solid #444;padding:8px 11px;font-size:10px;letter-spacing:2px;margin:10px 0 25px}.empty{background:#111;border:1px solid #292929;aspect-ratio:1/1;display:grid;place-items:center;color:#777}.buybox{margin-top:30px;border-top:1px solid #292929;padding-top:25px}.buybox label{display:block;font-size:11px;letter-spacing:2px;color:#888;margin-bottom:8px}.buybox input{width:80px;background:#111;color:#fff;border:1px solid #444;padding:12px}.actions{display:flex;gap:10px;margin:14px 0}.buy{background:#fff;color:#000;border:0;padding:15px 22px;font-weight:800;letter-spacing:1px;cursor:pointer}.buy.alt{background:#222;color:#fff;border:1px solid #555}.cartlink{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:2px;color:#aaa}@media(max-width:800px){.product{grid-template-columns:1fr;gap:25px;padding:35px 0}.gallery{grid-template-columns:1fr}.info h1{font-size:55px}.actions{flex-direction:column}.buy{width:100%}}
</style></head><body><div class="brand-watermark">VASTRAMM</div><div class="wrap"><nav class="nav"><a href="index.html">VASTRAMM</a><a href="index.html#collection">BACK TO COLLECTION ↗</a></nav><main id="page"><div class="product"><div class="empty">LOADING</div><div class="info"><div class="ey">VASTRAMM BY MY3</div><h1>LOADING</h1></div></div></main></div><script>
const db=window.supabase.createClient("https://xzipzscjjvkjuzkmtxsj.supabase.co","sb_publishable_GlX_WAPD7MApMRMGGVvMxA_2NtPC_y9");
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function getCart(){try{return JSON.parse(localStorage.getItem("vastramm_cart")||"[]")}catch(e){return[]}}
function saveCart(c){localStorage.setItem("vastramm_cart",JSON.stringify(c))}
function purchase(go){const p=window.VASTRAMM_PRODUCT;if(!p)return;const qty=Math.max(1,Number(document.getElementById("qty").value||1));const item={id:p.id,name:p.name,sku:p.sku,price:p.price,qty,image:p.images[0]||""};const c=getCart();const old=c.find(x=>String(x.id)===String(item.id));if(old)old.qty+=qty;else c.push(item);saveCart(c);if(go)location.href="checkout.html";else{const b=document.getElementById("add");b.textContent="ADDED ✓";setTimeout(()=>b.textContent="ADD TO CART",1500)}}
async function loadProduct(){try{const id=new URLSearchParams(location.search).get("id");if(!id)throw new Error("Product not found.");const r=await db.from("products").select("*").eq("id",id).single();if(r.error)throw r.error;let m={};try{const mr=await db.from("site_settings").select("setting_value").eq("setting_key","product_meta_"+id).maybeSingle();m=mr.data?.setting_value||{}}catch(e){}const imgs=Array.isArray(m.images)?m.images:[];window.VASTRAMM_PRODUCT={id:r.data.id,name:r.data.name,sku:r.data.sku||"",price:Number(r.data.price||0),images:imgs};document.title=(r.data.name||"Product")+" — VASTRAMM";document.getElementById("page").innerHTML='<div class="product"><div class="gallery">'+(imgs.length?imgs.map(u=>'<img src="'+esc(u)+'" alt="'+esc(r.data.name)+'">').join(""):'<div class="empty">NO IMAGE</div>')+'</div><div class="info"><div class="ey">'+esc(r.data.sku||"VASTRAMM")+" / PRODUCT</div><h1>"+esc(r.data.name)+"</h1><div class="price">₹"+Number(r.data.price||0).toLocaleString("en-IN")+'</div><span class="pill">'+esc(m.status==="soldout"?"SOLD OUT":m.featured?"FEATURED":"AVAILABLE")+'</span><p class="desc">'+esc(r.data.description||"No description available.")+'</p><div class="buybox"><label>QUANTITY</label><input id="qty" type="number" min="1" value="1"><div class="actions"><button class="buy" id="add">ADD TO CART</button><button class="buy alt" id="buy">BUY NOW</button></div><a class="cartlink" href="cart.html">VIEW CART →</a></div><br><a class="back" href="index.html#collection">← BACK TO COLLECTION</a></div></div>';document.getElementById("add").onclick=()=>purchase(false);document.getElementById("buy").onclick=()=>purchase(true)}catch(e){document.getElementById("page").innerHTML='<div class="product"><div class="info"><div class="ey">VASTRAMM BY MY3</div><h1>PRODUCT NOT FOUND.</h1><p class="desc">'+esc(e.message||"Unable to load this product.")+'</p><a class="back" href="index.html#collection">← BACK TO COLLECTION</a></div></div>'}}
loadProduct();
</script></body></html>
