<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VASTRAMM — Product</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f2;font-family:Arial,sans-serif}.watermark{position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(80px,18vw,260px);font-weight:900;letter-spacing:-10px;color:rgba(255,255,255,.025);transform:rotate(-8deg);pointer-events:none}.wrap{position:relative;z-index:1;max-width:1200px;margin:auto;padding:0 28px}.nav{padding:25px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between;letter-spacing:3px;font-weight:900}.nav a{color:#fff;text-decoration:none}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;padding:70px 0}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;background:#111;border:1px solid #292929}.placeholder{aspect-ratio:1;background:#111;border:1px solid #292929;display:grid;place-items:center;color:#777}.ey{font-size:10px;letter-spacing:4px;color:#888}.info h1{font-size:clamp(44px,7vw,90px);line-height:.88;letter-spacing:-5px;margin:22px 0}.price{font-size:25px;margin:20px 0}.desc{color:#aaa;line-height:1.8;white-space:pre-line}.pill{display:inline-block;border:1px solid #444;padding:8px 11px;font-size:10px;letter-spacing:2px}.buybox{border-top:1px solid #292929;margin-top:28px;padding-top:25px}.qty{width:80px;background:#111;color:#fff;border:1px solid #444;padding:12px}.actions{display:flex;gap:10px;margin:15px 0}.btn{display:inline-block;text-align:center;padding:16px 22px;background:#fff;color:#000;font-weight:900;letter-spacing:1px;text-decoration:none;border:1px solid #fff;cursor:pointer}.btn.dark{background:#111;color:#fff;border-color:#555}.cart{font-size:10px;letter-spacing:2px;color:#aaa;text-decoration:none}.error{padding:70px 0}.error h1{font-size:60px}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:35px 0;gap:25px}.gallery{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}.info h1{font-size:55px}}
</style></head><body><div class="watermark">VASTRAMM</div><div class="wrap"><nav class="nav"><a href="index.html">VASTRAMM</a><a href="index.html#collection">BACK TO COLLECTION ↗</a></nav><main id="app"><div class="layout"><div class="placeholder">LOADING</div><div><div class="ey">VASTRAMM BY MY3</div><h1>LOADING</h1></div></div></main></div><script>
var db=window.supabase.createClient("https://xzipzscjjvkjuzkmtxsj.supabase.co","sb_publishable_GlX_WAPD7MApMRMGGVvMxA_2NtPC_y9");
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})}
function readCart(){try{return JSON.parse(localStorage.getItem("vastramm_cart")||"[]")}catch(e){return[]}}
function writeCart(c){localStorage.setItem("vastramm_cart",JSON.stringify(c))}
async function load(){
 var id=new URLSearchParams(window.location.search).get("id");
 if(!id){showError("No product was selected.");return}
 try{
  var r=await db.from("products").select("*").eq("id",id).limit(1);
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)throw new Error("Product not found.");
  var product=r.data[0], meta={};
  try{
   var mr=await db.from("site_settings").select("*").eq("setting_key","product_meta_"+id).limit(1);
   if(!mr.error&&mr.data&&mr.data[0])meta=mr.data[0].setting_value||{};
  }catch(e){}
  var images=Array.isArray(meta.images)?meta.images:[];
  var status=meta.status==="soldout"?"SOLD OUT":meta.featured?"FEATURED":"AVAILABLE";
  document.title=product.name+" — VASTRAMM";
  document.getElementById("app").innerHTML='<div class="layout"><div class="gallery">'+(images.length?images.map(function(u){return '<img src="'+esc(u)+'" alt="'+esc(product.name)+'">'}).join(""):'<div class="placeholder">VASTRAMM / NO IMAGE</div>')+'</div><section class="info"><div class="ey">'+esc(product.sku||"VASTRAMM")+' / PRODUCT</div><h1>'+esc(product.name)+'</h1><div class="price">₹'+Number(product.price||0).toLocaleString("en-IN")+'</div><span class="pill">'+status+'</span><p class="desc">'+esc(product.description||"No description available.")+'</p><div class="buybox"><div class="ey">QUANTITY</div><input class="qty" id="qty" type="number" min="1" value="1"><div class="actions"><a class="btn" id="add" href="#">ADD TO CART</a><a class="btn dark" id="buy" href="#">BUY NOW</a></div><a class="cart" href="cart.html">VIEW CART →</a></div></section></div>';
  var q=document.getElementById("qty");
  document.getElementById("add").onclick=function(e){e.preventDefault();var n=Math.max(1,Number(q.value)||1);var c=readCart(),old=c.find(function(x){return String(x.id)===String(product.id)});var item={id:product.id,name:product.name,sku:product.sku||"",price:Number(product.price||0),qty:n,image:images[0]||""};if(old)old.qty+=n;else c.push(item);writeCart(c);window.location.href="cart.html"};
  document.getElementById("buy").onclick=function(e){e.preventDefault();var n=Math.max(1,Number(q.value)||1);var item={id:product.id,name:product.name,sku:product.sku||"",price:Number(product.price||0),qty:n,image:images[0]||""};writeCart([item]);window.location.href="checkout.html"};
 }catch(e){showError(e.message||"Unable to load this product.")}
}
function showError(msg){document.getElementById("app").innerHTML='<div class="error"><div class="ey">VASTRAMM BY MY3</div><h1>PRODUCT NOT FOUND.</h1><p class="desc">'+esc(msg)+'</p><a class="btn" href="index.html#collection">← BACK TO COLLECTION</a></div>'}
load();
</script></body></html>
