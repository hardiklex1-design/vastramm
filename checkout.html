<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — VASTRAMM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f2;font-family:Arial;position:relative;overflow-x:hidden}.brand-watermark{position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(90px,18vw,280px);font-weight:900;letter-spacing:-12px;color:rgba(255,255,255,.025);pointer-events:none;z-index:0;transform:rotate(-8deg)}.wrap{position:relative;z-index:1;max-width:1100px;margin:auto;padding:28px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #292929;padding-bottom:20px;letter-spacing:3px;font-weight:900}.layout{display:grid;grid-template-columns:1fr .7fr;gap:30px;margin-top:35px}.panel{border:1px solid #292929;background:#111;padding:24px}.field{margin-bottom:16px}.field label{display:block;color:#999;font-size:11px;letter-spacing:2px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#0b0b0b;color:#fff;border:1px solid #444;padding:13px}.field textarea{min-height:100px}.btn{background:#fff;color:#000;padding:15px 22px;border:0;font-weight:900;cursor:pointer;width:100%}.muted{color:#888}.item{display:flex;justify-content:space-between;border-bottom:1px solid #292929;padding:12px 0}.total{font-size:24px;text-align:right;margin-top:20px}.success{text-align:center;padding:50px 20px}.order{font-size:26px;letter-spacing:3px}.track{display:inline-block;background:#fff;color:#000;padding:14px 20px;margin-top:20px;text-decoration:none;font-weight:900}@media(max-width:750px){.wrap{padding:18px}.layout{grid-template-columns:1fr}}
</style></head><body><div class="brand-watermark">VASTRAMM</div><div class="wrap"><nav class="nav"><a href="index.html">VASTRAMM</a><a href="cart.html">CART</a></nav><main id="app"></main></div><script>
async function processBuy(){const p=new URLSearchParams(location.search),id=p.get("buy"),qty=Math.max(1,Number(p.get("qty")||1));if(!id)return;try{const r=await db.from("products").select("*").eq("id",id).single();if(r.error)return;let m={};try{m=(await db.from("site_settings").select("setting_value").eq("setting_key","product_meta_"+id).maybeSingle()).data?.setting_value||{}}catch(e){}const item={id:r.data.id,name:r.data.name,sku:r.data.sku||"",price:Number(r.data.price||0),qty,image:Array.isArray(m.images)?m.images[0]||"":""};localStorage.setItem("vastramm_cart",JSON.stringify([item]));history.replaceState({}, "", "checkout.html")}catch(e){}}
const db=window.supabase.createClient("https://xzipzscjjvkjuzkmtxsj.supabase.co","sb_publishable_GlX_WAPD7MApMRMGGVvMxA_2NtPC_y9");
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));function cart(){try{return JSON.parse(localStorage.getItem("vastramm_cart")||"[]")}catch(e){return[]}}function money(n){return Number(n||0).toLocaleString("en-IN")}
async function render(){
 const c=cart();
 if(!c.length){document.getElementById("app").innerHTML='<div class="panel"><h1>CART IS EMPTY.</h1><a href="index.html#collection">Return to collection</a></div>';return}
 let sold=[];
 for(const x of c){
  if(x.status==="soldout"){sold.push(x.name);continue}
  if(x.id){
   try{
    const pr=await db.from("products").select("stock").eq("id",x.id).maybeSingle();
    if(!pr.error&&pr.data&&Number(pr.data.stock||0)<=0)sold.push(x.name);
   }catch(e){}
   try{
    const mr=await db.from("site_settings").select("setting_value").eq("setting_key","product_meta_"+x.id).maybeSingle();
    if(!mr.error&&mr.data?.setting_value?.status==="soldout")sold.push(x.name);
   }catch(e){}
  }
 }
 if(sold.length){
  document.getElementById("app").innerHTML='<div class="panel"><h1>ITEM SOLD OUT.</h1><p class="muted">'+sold.map(esc).join(", ")+' is currently sold out and cannot be ordered.</p><a class="track" href="cart.html">RETURN TO CART</a></div>';
  return;
 }
 let total=c.reduce((s,x)=>s+x.price*x.qty,0);
 document.getElementById("app").innerHTML='<div class="layout"><form class="panel" id="form"><h1>CHECKOUT</h1><div class="field"><label>FULL NAME</label><input id="name" required></div><div class="field"><label>EMAIL</label><input id="email" type="email" required></div><div class="field"><label>PHONE</label><input id="phone" required></div><div class="field"><label>ADDRESS</label><textarea id="address" required></textarea></div><div class="field"><label>CITY</label><input id="city" required></div><div class="field"><label>PINCODE</label><input id="pin" required></div><div class="field"><label>PAYMENT</label><select id="payment"><option>Cash on Delivery</option><option>UPI / Online — confirm after order</option></select></div><button class="btn">PLACE ORDER</button><p id="msg" class="muted"></p></form><div class="panel"><h2>ORDER SUMMARY</h2>'+c.map(x=>'<div class="item"><span>'+esc(x.name)+' × '+x.qty+'</span><b>₹'+money(x.price*x.qty)+'</b></div>').join('')+'<div class="total">₹'+money(total)+'</div></div></div>';
 document.getElementById("form").onsubmit=submit
}

async function insertOrder(order){let row={order_number:order.orderNumber,customer_name:order.name,email:order.email,phone:order.phone,address:order.address,city:order.city,pincode:order.pin,items:order.items,total:order.total,payment_method:order.payment,status:"PLACED",tracking_status:"ORDER PLACED"};for(let tries=0;tries<15;tries++){const r=await db.from("orders").insert(row).select().single();if(!r.error)return true;const m=String(r.error.message||"");const mt=m.match(/Could not find the '([^']+)' column of 'orders'|column ['"]?([^'"]+)['"]? of ['"]?orders['"]? does not exist/i);const bad=(mt&&(mt[1]||mt[2]));if(!bad||!(bad in row))return false;delete row[bad]}return false}
async function submit(ev){ev.preventDefault();const msg=document.getElementById("msg");msg.textContent="Creating your order…";const c=cart(),total=c.reduce((s,x)=>s+x.price*x.qty,0),order={orderNumber:"VST-"+Date.now().toString().slice(-8),name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),phone:document.getElementById("phone").value.trim(),address:document.getElementById("address").value.trim(),city:document.getElementById("city").value.trim(),pin:document.getElementById("pin").value.trim(),payment:document.getElementById("payment").value,items:c,total:total};let saved=false;try{saved=await insertOrder(order)}catch(e){}localStorage.setItem("vastramm_last_order",JSON.stringify(order));localStorage.setItem("vastramm_order_"+order.orderNumber,JSON.stringify({...order,status:"ORDER PLACED",saved:saved}));localStorage.removeItem("vastramm_cart");document.getElementById("app").innerHTML='<div class="panel success"><div class="muted">ORDER CONFIRMED</div><h1>THANK YOU.</h1><p>Your order number</p><div class="order">'+order.orderNumber+'</div><p class="muted">Keep this number to track your order.</p><a class="track" href="track.html?order='+encodeURIComponent(order.orderNumber)+'">TRACK ORDER</a></div>'}processBuy().then(()=>render());
</script></body></html>
