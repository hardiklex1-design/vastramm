<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — VASTRAMM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f2;font-family:Arial}.wrap{max-width:850px;margin:auto;padding:30px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #292929;padding-bottom:20px;letter-spacing:3px;font-weight:900}.panel{margin-top:45px;background:#111;border:1px solid #292929;padding:28px}.field{display:flex;gap:10px}.field input{flex:1;background:#080808;color:#fff;border:1px solid #444;padding:14px}.btn{background:#fff;color:#000;border:0;padding:14px 20px;font-weight:900}.status{margin-top:30px}.step{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid #292929}.dot{width:12px;height:12px;border:1px solid #fff;border-radius:50%;margin-top:4px}.muted{color:#888}.order{font-size:25px;letter-spacing:3px}@media(max-width:600px){.wrap{padding:18px}.field{flex-direction:column}}
</style></head><body><div class="wrap"><nav class="nav"><a href="index.html">VASTRAMM</a><a href="index.html#collection">SHOP</a></nav><main class="panel"><div class="muted">VASTRAMM BY MY3</div><h1>TRACK YOUR ORDER</h1><div class="field"><input id="code" placeholder="Enter order number e.g. VST-12345678"><button class="btn" onclick="track()">TRACK</button></div><div id="result"></div></main></div><script>
const db=window.supabase.createClient("https://xzipzscjjvkjuzkmtxsj.supabase.co","sb_publishable_GlX_WAPD7MApMRMGGVvMxA_2NtPC_y9");const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));const params=new URLSearchParams(location.search);if(params.get("order"))document.getElementById("code").value=params.get("order");
async function track(){
 const code=document.getElementById("code").value.trim();if(!code)return;
 let order=null;
 try{const r=await db.from("orders").select("*").eq("order_number",code).maybeSingle();if(!r.error&&r.data)order=r.data}catch(e){}
 if(!order){try{order=JSON.parse(localStorage.getItem("vastramm_order_"+code)||"null")}catch(e){}}
 let status=order?.tracking_status||order?.status||"ORDER PLACED";
 if(order?.id){
  try{const mr=await db.from("site_settings").select("setting_value").eq("setting_key","order_meta_"+order.id).maybeSingle();if(!mr.error&&mr.data?.setting_value?.tracking_status)status=mr.data.setting_value.tracking_status}catch(e){}
 }
 const stages=["ORDER PLACED","CONFIRMED","PACKED","SHIPPED","OUT FOR DELIVERY","DELIVERED"];
 const current=stages.indexOf(status);
 document.getElementById("result").innerHTML=order?'<div class="status"><div class="muted">ORDER NUMBER</div><div class="order">'+esc(code)+'</div>'+
 stages.map(function(stage,i){const done=current>=i;return '<div class="step" style="opacity:'+(done?'1':'.45')+'"><span class="dot" style="'+(done?'background:#fff':'')+'"></span><div><b>'+stage+'</b><div class="muted">'+(i===current?'Current tracking status.':i<current?'Completed.':i===0?'Your order has been received.':'Waiting for update.')+'</div></div></div>'}).join('')+
 '</div>':'<div class="status"><p>We could not find that order.</p><p class="muted">Check the order number and try again.</p></div>';
}
</script></body></html>
